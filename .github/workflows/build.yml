name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tulis file proyek
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoClicker"
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          mkdir -p app
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.autoclicker'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.autoclicker'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Auto Clicker"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AutoClickService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/example/autoclicker
          cat > app/src/main/java/com/example/autoclicker/AutoClickService.kt << 'EOF'
          package com.example.autoclicker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button

          class AutoClickService : AccessibilityService() {

              private val handler = Handler(Looper.getMainLooper())
              private var running = false
              private var button: Button? = null
              private lateinit var wm: WindowManager

              private val tapRunnable = object : Runnable {
                  override fun run() {
                      if (!running) return
                      tap()
                      handler.postDelayed(this, interval())
                  }
              }

              private fun interval(): Long =
                  getSharedPreferences("cfg", MODE_PRIVATE).getLong("interval", 600L).coerceAtLeast(50L)

              private fun tap() {
                  val dm = resources.displayMetrics
                  val x = dm.widthPixels / 2f
                  val y = dm.heightPixels / 2f
                  val path = Path().apply { moveTo(x, y); lineTo(x + 1f, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 30))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              private fun toggle() {
                  running = !running
                  button?.text = if (running) "STOP" else "START"
                  if (running) handler.post(tapRunnable) else handler.removeCallbacks(tapRunnable)
              }

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20; y = 200
                  }

                  val btn = Button(this).apply { text = "START"; alpha = 0.8f }
                  var startX = 0f; var startY = 0f; var origX = 0; var origY = 0; var moved = false
                  btn.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = e.rawX; startY = e.rawY
                              origX = lp.x; origY = lp.y; moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - startX).toInt()
                              val dy = (e.rawY - startY).toInt()
                              if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true
                              if (moved) { lp.x = origX + dx; lp.y = origY + dy; wm.updateViewLayout(btn, lp) }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) toggle()
                      }
                      true
                  }
                  button = btn
                  wm.addView(btn, lp)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  running = false
                  handler.removeCallbacks(tapRunnable)
                  button?.let { wm.removeView(it) }
                  super.onDestroy()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/autoclicker
          cat > app/src/main/java/com/example/autoclicker/MainActivity.kt << 'EOF'
          package com.example.autoclicker

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                  }
                  root.addView(TextView(this).apply { text = "Interval tap (milidetik):" })

                  val input = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(prefs.getLong("interval", 600L).toString())
                  }
                  root.addView(input)

                  root.addView(Button(this).apply {
                      text = "Simpan interval"
                      setOnClickListener {
                          val v = input.text.toString().toLongOrNull() ?: 600L
                          prefs.edit().putLong("interval", v.coerceAtLeast(50L)).apply()
                          Toast.makeText(context, "Tersimpan", Toast.LENGTH_SHORT).show()
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Aktifkan layanan Aksesibilitas"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  root.addView(TextView(this).apply {
                      text = "\nCara pakai: aktifkan layanan, buka game, lalu tekan tombol START melayang. " +
                          "Tap dilakukan di tengah layar. Tombol bisa digeser."
                  })
                  setContentView(root)
              }
          }
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/service_desc" />
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings_extra.xml << 'EOF'
          <resources>
              <string name="service_desc">Melakukan tap otomatis pada layar sesuai interval yang diatur.</string>
          </resources>
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
